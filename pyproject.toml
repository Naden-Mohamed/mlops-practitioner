[project]
name = "mlops-practitioner"
version = "0.1.0"
description = "apply mlops fundamentals"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastparquet>=2026.5.0",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pandas>=3.0.5",
    "path>=17.1.1",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-json-logger>=4.2.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "skl2onnx>=1.20.0",
    "uvicorn>=0.52.4",
]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=prodml --cov-report=term-missing --cov-fail-under=55"

[tool.coverage.run]
source = ["src/prodml"]
omit = ["*/__init__.py"]
